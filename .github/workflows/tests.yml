name: tests

on:
  push:
  pull_request:
  workflow_dispatch:   # adds a "Run workflow" button on the Actions tab

jobs:
  analysis:
    # The analysis core against synthetic blots with known answers, on every OS.
    name: analysis (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Accuracy test
        run: python tests/test_analysis.py

  gui:
    # The PyQt6 app driven by real mouse events on an offscreen display.
    name: Qt app (ubuntu, Python 3.12)
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: End-to-end GUI test
        run: python tests/test_qt_app.py
      - name: Upload screenshots
        if: always()   # keep them when the test fails too: they show what went wrong
        uses: actions/upload-artifact@v4
        with:
          name: gui-screenshots
          path: tests/out/*.png
          if-no-files-found: ignore
